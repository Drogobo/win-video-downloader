name: Build Windows and macOS packages

on:
  # Start manually: Actions tab -> "Build Windows and macOS packages" ->
  # "Run workflow" (or `gh workflow run build-packages.yml`)
  workflow_dispatch:
  push:
    paths:
      - 'packaging/**'
      - 'src/util/os_compat.py'
      - '.github/workflows/build-packages.yml'

jobs:
  windows:
    name: Windows (built on Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build gettext librsvg2-bin desktop-file-utils \
            libglib2.0-bin libglib2.0-dev-bin gtk-update-icon-cache zstd \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Build
        run: python3 packaging/windows/build_windows.py --no-zip
      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-windows-x64
          path: packaging/build/windows/VideoDownloader-*/
          if-no-files-found: error

  windows-test:
    name: Windows (test)
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VideoDownloader-windows-x64
          path: bundle
      - name: Download test
        shell: pwsh
        run: |
          $b = (Get-ChildItem bundle -Directory)[0].FullName
          # Only use the bundled programs
          $env:Path = "C:\Windows\System32;C:\Windows"
          & "$b\bin\python.exe" -X utf8 packaging\smoke_test.py $b
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Start the program
        shell: pwsh
        run: |
          $b = (Get-ChildItem bundle -Directory)[0].FullName
          $p = Start-Process -FilePath "$b\bin\python.exe" `
            -ArgumentList "-X utf8 `"$b\share\video-downloader\launcher.py`"" `
            -RedirectStandardError stderr.txt -PassThru
          Start-Sleep -Seconds 20
          Get-Content stderr.txt
          if ($p.HasExited) { Write-Error "program exited"; exit 1 }
          if (Select-String -Path stderr.txt -Pattern "Traceback|CRITICAL") {
            Write-Error "errors in output"; exit 1
          }
          Stop-Process -Id $p.Id
          if (-not (Test-Path "$b\Video Downloader.exe")) {
            Write-Error "launcher missing"; exit 1
          }

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: packaging/macos/build_macos.sh
      - name: Test
        run: |
          app="packaging/build/macos/dist/Video Downloader.app"
          exe="$app/Contents/MacOS/Video Downloader"
          # The download process starts and sends its first request
          "$exe" --run-module video_downloader.downloader < /dev/null \
            > child.txt 2>&1 || true
          cat child.txt
          grep -q '"method"' child.txt
          # The program starts without errors
          "$exe" > app.txt 2>&1 &
          pid=$!
          sleep 20
          cat app.txt
          kill -0 "$pid"
          ! grep -E 'Traceback|CRITICAL' app.txt
          kill "$pid"
      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-macos-${{ matrix.arch }}
          path: packaging/dist/*.dmg
          if-no-files-found: error
